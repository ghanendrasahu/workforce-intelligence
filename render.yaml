# Render blueprint for workforce-intelligence.
# Mirrors the live service configuration; inert until an explicit Blueprint Sync.
# Secret values are declared with sync:false and stay in the Render dashboard.
services:
- type: web
  name: workforce-intelligence-api
  runtime: python
  plan: free
  region: oregon
  branch: main
  buildCommand: grep -vE '^(pytest==|pytest-cov==|coverage==|ruff==|mypy==|mypy-extensions==)' requirements.lock > runtime.lock && pip install -r runtime.lock && pip install --no-deps -e . && python -m
    data.ingestion.synthetic_generator && python -m ml.training.train
  startCommand: sh -c "uvicorn apps.api.app.main:app --host 0.0.0.0 --port=${PORT:-10000}"
  healthCheckPath: /health
  autoDeploy: true
  envVars:
  - key: PYTHON_VERSION
    value: 3.11.12
- type: web
  name: workforce-intelligence-ui
  runtime: python
  plan: free
  region: oregon
  branch: main
  buildCommand: pip install -r apps/dashboard/requirements-streamlit.txt
  startCommand: sh -c "streamlit run apps/dashboard/app.py --server.port=${PORT:-10000} --server.address=0.0.0.0 --server.headless=true"
  healthCheckPath: /_stcore/health
  autoDeploy: true
  envVars:
  - key: API_BASE_URL
    value: https://workforce-intelligence-api-1n9k.onrender.com
