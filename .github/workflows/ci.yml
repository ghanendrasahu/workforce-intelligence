name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        # Deterministic tree from requirements.lock (regenerate on dep changes).
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy core data ml ai apps

      - name: Tests (pytest)
        run: pytest tests/ -p no:warnings -q --cov=core --cov=data --cov=ml --cov=ai --cov=apps --cov-report=term-missing --cov-fail-under=70
