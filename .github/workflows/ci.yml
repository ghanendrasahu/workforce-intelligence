name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        # Deterministic tree from requirements.lock (regenerate on dep changes).
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy core data ml ai apps

      - name: Tests (pytest)
        run: pytest tests/ -p no:warnings -q --cov=core --cov=data --cov=ml --cov=ai --cov=apps --cov-report=term-missing --cov-fail-under=70

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: workforce-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Verify it runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id workforce-api:ci -u)
          if [ "$uid" = "0" ]; then
            echo "ERROR: the image runs as root"; exit 1
          fi
          echo "image runs as uid $uid"
